kind = "web"
  previewPath = "/"
  title = "Brand OS"
  version = "1.0.0"
  id = "artifacts/brand-os"

  [[integratedSkills]]
  name = "react-vite"
  version = "1.0.0"

  [[services]]
  localPort = 18565
  name = "web"
  paths = ["/"]

  [services.development]
  run = "pnpm --filter @workspace/brand-os run dev"

  [services.env]
  PORT = "18565"
  BASE_PATH = "/"

  [services.production]
  build = ["sh", "-c", "pnpm --filter @workspace/brand-os run build && pnpm --filter @workspace/api-server run build"]
  run = ["node", "artifacts/api-server/dist/index.cjs"]
  