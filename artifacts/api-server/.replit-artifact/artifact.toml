kind = "api"
  previewPath = "/api"
  title = "Brand OS API"
  version = "1.0.0"
  id = "3B4_FFSkEVBkAeYMFRJ2e"

  [[services]]
  localPort = 8080
  name = "API Server"
  paths = ["/api"]

  [services.env]
  PORT = "8080"

  [services.development]
  run = "pnpm --filter @workspace/api-server run dev"

  [services.production]
  build = "pnpm --filter @workspace/brand-os run build && pnpm --filter @workspace/api-server run build && cp -r artifacts/brand-os/dist/public artifacts/api-server/dist/public"
  run = "node artifacts/api-server/dist/index.cjs"

  [services.production.health.startup]
  path = "/api/healthz"
  