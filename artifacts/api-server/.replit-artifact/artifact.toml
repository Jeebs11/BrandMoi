kind = "api"
  previewPath = "/"
  title = "Brand OS"
  version = "1.0.0"
  id = "3B4_FFSkEVBkAeYMFRJ2e"

  [[services]]
  localPort = 8080
  name = "API Server"
  paths = ["/"]

  [services.env]
  PORT = "8080"

  [services.development]
  run = "pnpm --filter @workspace/api-server run dev"

  [services.production]
  build = ["sh", "-c", "pnpm --filter @workspace/brand-os run build && pnpm --filter @workspace/api-server run build"]
  run = ["node", "artifacts/api-server/dist/index.cjs"]

  [services.production.health.startup]
  path = "/api/healthz"
  