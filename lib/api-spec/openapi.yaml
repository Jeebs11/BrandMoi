openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Brand OS API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: user
    description: User data operations
  - name: drafts
    description: Draft content operations
  - name: ai
    description: AI generation operations
  - name: linkedin
    description: LinkedIn OAuth and sync operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out (clears session cookie)
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user/preferences:
    get:
      operationId: getPreferences
      tags: [user]
      summary: Get the current user's brand preferences
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferencesResponse"
    put:
      operationId: updatePreferences
      tags: [user]
      summary: Update the current user's brand preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePreferencesBody"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferencesResponse"

  /user/suggestions:
    get:
      operationId: getSuggestions
      tags: [user]
      summary: Get personalised content suggestions
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SuggestionItem"

  /ai/structure:
    post:
      operationId: structureIdea
      tags: [ai]
      summary: Extract structured breakdown from a raw thought
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StructureIdeaBody"
      responses:
        "200":
          description: Structured breakdown (evergreen + optional trending lane)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StructureIdeaResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: AI error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /agent/brief:
    get:
      operationId: getAgentBrief
      tags: [agent]
      summary: Get AI-generated daily brief with content angles and teach ideas
      responses:
        "200":
          description: Agent brief with angles and teach angles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentBriefResponse"
        "401":
          description: Unauthorized

  /ai/generate:
    post:
      operationId: generateContent
      tags: [ai]
      summary: Generate LinkedIn content from confirmed structure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateContentBody"
      responses:
        "200":
          description: Generated content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedContent"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: AI error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ai/refine:
    post:
      operationId: refineContent
      tags: [ai]
      summary: Refine existing content based on an instruction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefineContentBody"
      responses:
        "200":
          description: Refined content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefinedContent"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: AI error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /linkedin/status:
    get:
      operationId: getLinkedinStatus
      tags: [linkedin]
      summary: Get LinkedIn connection status for the current user
      responses:
        "200":
          description: LinkedIn connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedinStatusResponse"

  /linkedin/auth:
    get:
      operationId: linkedinAuth
      tags: [linkedin]
      summary: Redirect to LinkedIn OAuth authorization screen
      responses:
        "302":
          description: Redirect to LinkedIn OAuth

  /linkedin/callback:
    get:
      operationId: linkedinCallback
      tags: [linkedin]
      summary: LinkedIn OAuth callback — exchanges code, stores token, redirects to Settings
      responses:
        "302":
          description: Redirect to Settings page

  /linkedin/disconnect:
    delete:
      operationId: linkedinDisconnect
      tags: [linkedin]
      summary: Disconnect LinkedIn account
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                required: [ok]

  /linkedin/sync:
    post:
      operationId: linkedinSync
      tags: [linkedin]
      summary: Sync original posts from LinkedIn into the Library
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedinSyncResponse"

  /analytics/overview:
    get:
      operationId: getAnalyticsOverview
      tags: [drafts]
      summary: Analytics overview response
      responses:
        "200":
          description: Analytics overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsOverviewResponse"

  /drafts:
    get:
      operationId: listDrafts
      tags: [drafts]
      summary: List all drafts for the current user
      responses:
        "200":
          description: List of drafts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Draft"
    post:
      operationId: createDraft
      tags: [drafts]
      summary: Create a new draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDraftBody"
      responses:
        "201":
          description: Created draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"

  /drafts/{id}:
    get:
      operationId: getDraft
      tags: [drafts]
      summary: Get a single draft
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateDraft
      tags: [drafts]
      summary: Update a draft's content or status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDraftBody"
      responses:
        "200":
          description: Updated draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteDraft
      tags: [drafts]
      summary: Delete a draft
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    RegisterBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        displayName:
          type: string
      required:
        - email
        - password
        - displayName

    LoginBody:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    UserResponse:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        displayName:
          type: string
      required:
        - id
        - email
        - displayName

    PreferencesResponse:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        objective:
          type: string
        persona:
          type: string
        tone:
          type: string
        brandRole:
          type: string
        brandAudience:
          type: string
        brandBelief:
          type: string
        aboutMe:
          type: string
          description: Free-text creator bio used as primary AI context; replaces Objective/Persona labels when non-empty.
        onboarded:
          type: boolean
      required:
        - id
        - userId
        - objective
        - persona
        - tone
        - brandRole
        - brandAudience
        - brandBelief
        - onboarded

    UpdatePreferencesBody:
      type: object
      properties:
        objective:
          type: string
        persona:
          type: string
        tone:
          type: string
        brandRole:
          type: string
        brandAudience:
          type: string
        brandBelief:
          type: string
        aboutMe:
          type: string
          maxLength: 500
          description: Free-text creator bio; replaces Objective/Persona labels in AI context when non-empty.
        onboarded:
          type: boolean

    SuggestionItem:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        message:
          type: string
        action:
          type: string
      required:
        - id
        - type
        - message
        - action

    StructureIdeaBody:
      type: object
      properties:
        rawInput:
          type: string
        objective:
          type: string
        persona:
          type: string
        tone:
          type: string
      required:
        - rawInput
        - objective
        - persona
        - tone

    HookItem:
      type: object
      properties:
        text:
          type: string
        type:
          type: string
          enum: [how-i, contrarian, number, how-to, story]
      required:
        - text

    StructuredBreakdown:
      type: object
      properties:
        topic:
          type: string
        angle:
          type: string
        coreMessage:
          type: string
        whyItMatters:
          type: string
        archetype:
          type: string
        hooks:
          type: array
          items:
            $ref: "#/components/schemas/HookItem"
        narrativeFlow:
          type: array
          items:
            type: string
        storyMode:
          type: boolean
        teacherMode:
          type: boolean
      required:
        - topic
        - angle
        - coreMessage
        - whyItMatters
        - hooks
        - narrativeFlow

    StructureIdeaResponse:
      type: object
      properties:
        evergreen:
          $ref: "#/components/schemas/StructuredBreakdown"
        trending:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/StructuredBreakdown"
        hookUsage:
          type: object
          additionalProperties:
            type: integer
      required:
        - evergreen

    CarouselSlide:
      type: object
      properties:
        slide:
          type: integer
        title:
          type: string
        description:
          type: string
      required:
        - slide
        - title

    GenerateContentBody:
      type: object
      properties:
        rawInput:
          type: string
        objective:
          type: string
        persona:
          type: string
        tone:
          type: string
        structure:
          $ref: "#/components/schemas/StructuredBreakdown"
        selectedHook:
          type: string
        includeCta:
          type: boolean
        storyMode:
          type: boolean
        postTone:
          type: string
        teacherMode:
          type: boolean
      required:
        - rawInput
        - objective
        - persona
        - tone
        - structure
        - selectedHook

    GeneratedContent:
      type: object
      properties:
        post:
          type: string
        carousel:
          type: array
          items:
            $ref: "#/components/schemas/CarouselSlide"
        visual:
          type: string
      required:
        - post
        - carousel
        - visual

    RefineContentBody:
      type: object
      properties:
        content:
          type: string
        instruction:
          type: string
        tab:
          type: string
          enum: [post, carousel, visual]
      required:
        - content
        - instruction
        - tab

    RefinedContent:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    Draft:
      type: object
      properties:
        id:
          type: integer
        rawInput:
          type: string
        objective:
          type: string
        persona:
          type: string
        tone:
          type: string
        structuredBreakdown:
          $ref: "#/components/schemas/StructuredBreakdown"
        postOutput:
          type: ["string", "null"]
        carouselOutput:
          type: ["string", "null"]
        visualOutput:
          type: ["string", "null"]
        status:
          type: string
          enum: [draft, ready, published]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        contentSource:
          type: string
          enum: [capture, news_reaction, teach_audience, story_mode, brand_voice_idea, linkedin]
          nullable: true
        externalId:
          type: ["string", "null"]
          description: External platform ID (e.g. LinkedIn UGC post URN) for deduplication
        postType:
          type: ["string", "null"]
          description: Post subtype for imported content (post, article)
      required:
        - id
        - rawInput
        - objective
        - persona
        - tone
        - structuredBreakdown
        - status
        - createdAt
        - updatedAt

    CreateDraftBody:
      type: object
      properties:
        rawInput:
          type: string
        objective:
          type: string
        persona:
          type: string
        tone:
          type: string
        structuredBreakdown:
          $ref: "#/components/schemas/StructuredBreakdown"
        postOutput:
          type: ["string", "null"]
        carouselOutput:
          type: ["string", "null"]
        visualOutput:
          type: ["string", "null"]
        status:
          type: string
          enum: [draft, ready, published]
        contentSource:
          type: string
          enum: [capture, news_reaction, teach_audience, story_mode, brand_voice_idea, linkedin]
        visualType:
          type: string
          enum: [none, card, carousel, infographic, art]
      required:
        - rawInput
        - objective
        - persona
        - tone
        - structuredBreakdown
        - status

    UpdateDraftBody:
      type: object
      properties:
        postOutput:
          type: ["string", "null"]
        carouselOutput:
          type: ["string", "null"]
        visualOutput:
          type: ["string", "null"]
        status:
          type: string
          enum: [draft, ready, published]
        contentSource:
          type: string
          enum: [capture, news_reaction, teach_audience, story_mode, brand_voice_idea, linkedin]
        visualType:
          type: string
          enum: [none, card, carousel, infographic, art]

    LinkedinStatusResponse:
      type: object
      properties:
        configured: { type: boolean }
        connected: { type: boolean }
        displayName: { type: string }
        memberUrn: { type: string }
        lastSyncedAt: { type: ["string", "null"] }
      required: [configured, connected]

    LinkedinSyncResponse:
      type: object
      properties:
        imported: { type: integer }
        skipped: { type: integer }
        total: { type: integer }
      required: [imported, skipped, total]

    AgentBriefResponse:
      type: object
      properties:
        headline:
          type: string
        insight:
          type: string
        angles:
          type: array
          items:
            type: string
        teachAngles:
          type: array
          items:
            type: string
        newsHeadline:
          type: string
        newsSourceLine:
          type: string
        newsUrl:
          type: string
        newsPublishedAt:
          type: string
        newsSourceDomain:
          type: string
        newsDescription:
          type: string
      required:
        - headline
        - insight
        - angles
        - teachAngles

    AnalyticsOverviewResponse:
      type: object
      summary: Analytics overview response
      properties:
        totalPublished:
          type: integer
        avgResonance:
          type: integer
        loggedPerformanceCount:
          type: integer
        byTone:
          type: array
          items:
            type: object
            properties:
              tone: { type: string }
              count: { type: integer }
              sampledCount: { type: integer }
              avgResonance: { type: ["integer", "null"] }
            required: [tone, count, sampledCount, avgResonance]
        byContentSource:
          type: array
          items:
            type: object
            properties:
              source:
                type: string
                enum: [capture, news_reaction, teach_audience, story_mode, brand_voice_idea, linkedin]
              count: { type: integer }
              sampledCount: { type: integer }
              avgResonance: { type: ["integer", "null"] }
            required: [source, count, sampledCount, avgResonance]
        byVisualType:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: [none, card, carousel, infographic, art]
              count: { type: integer }
              sampledCount: { type: integer }
              avgResonance: { type: ["integer", "null"] }
            required: [type, count, sampledCount, avgResonance]
        byObjective:
          type: array
          items:
            type: object
            properties:
              objective: { type: string }
              count: { type: integer }
              sampledCount: { type: integer }
              avgResonance: { type: ["integer", "null"] }
            required: [objective, count, sampledCount, avgResonance]
        topPosts:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              topic: { type: string }
              resonance: { type: integer }
              tone: { type: ["string", "null"] }
              contentSource: { type: string }
              visualType: { type: string }
              publishedAt: { type: string }
            required: [id, topic, resonance, tone, contentSource, visualType, publishedAt]
        weeklyTrend:
          type: array
          items:
            type: object
            properties:
              week: { type: string }
              count: { type: integer }
            required: [week, count]
        weeklyResonanceTrend:
          type: array
          items:
            type: object
            properties:
              week: { type: string }
              avgResonance: { type: integer }
              sampleCount: { type: integer }
            required: [week, avgResonance, sampleCount]
        last30: { type: integer }
        last60: { type: integer }
        last90: { type: integer }
      required:
        - totalPublished
        - avgResonance
        - loggedPerformanceCount
        - byTone
        - byContentSource
        - byVisualType
        - byObjective
        - topPosts
        - weeklyTrend
        - weeklyResonanceTrend
        - last30
        - last60
        - last90
