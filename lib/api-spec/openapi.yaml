openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Brand OS API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: user
    description: User data operations
  - name: drafts
    description: Draft content operations
  - name: ai
    description: AI generation operations
  - name: linkedin
    description: LinkedIn OAuth and sync operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out (clears session cookie)
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user/preferences:
    get:
      operationId: getPreferences
      tags: [user]
      summary: Get the current user's brand preferences
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferencesResponse"
    put:
      operationId: updatePreferences
      tags: [user]
      summary: Update the current user's brand preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePreferencesBody"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferencesResponse"

  /user/suggestions:
    get:
      operationId: getSuggestions
      tags: [user]
      summary: Get personalised content suggestions
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SuggestionItem"

  /agent/brief:
    get:
      operationId: getAgentBrief
      tags: [agent]
      summary: Get AI-generated daily brief with content angles and teach ideas
      responses:
        "200":
          description: Agent brief with angles and teach angles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentBriefResponse"
        "401":
          description: Unauthorized

  /ai/generate:
    post:
      operationId: generateContent
      tags: [ai]
      summary: Generate LinkedIn content from raw idea with audience and feeling
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateContentBody"
      responses:
        "200":
          description: Generated content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedContent"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: AI error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ai/refine:
    post:
      operationId: refineContent
      tags: [ai]
      summary: Refine existing content based on an instruction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefineContentBody"
      responses:
        "200":
          description: Refined content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefinedContent"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: AI error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ai/explore-directions:
    post:
      operationId: exploreDirections
      tags: [ai]
      summary: Generate 3 minimal post concepts (hook + key points) in distinct feelings before committing to a full post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExploreDirectionsBody"
      responses:
        "200":
          description: Three direction concepts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExploreDirectionsResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: AI error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ai/performance-insights:
    get:
      operationId: getPerformanceInsights
      tags: [ai]
      summary: Lightweight performance stats — returns best feeling and audience combo for the current user based on resonance history
      responses:
        "200":
          description: Performance insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceInsightsResponse"

  /linkedin/status:
    get:
      operationId: getLinkedinStatus
      tags: [linkedin]
      summary: Get LinkedIn connection status for the current user
      responses:
        "200":
          description: LinkedIn connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedinStatusResponse"

  /linkedin/auth:
    get:
      operationId: linkedinAuth
      tags: [linkedin]
      summary: Redirect to LinkedIn OAuth authorization screen
      responses:
        "302":
          description: Redirect to LinkedIn OAuth

  /linkedin/callback:
    get:
      operationId: linkedinCallback
      tags: [linkedin]
      summary: LinkedIn OAuth callback — exchanges code, stores token, redirects to Settings
      responses:
        "302":
          description: Redirect to Settings page

  /linkedin/disconnect:
    delete:
      operationId: linkedinDisconnect
      tags: [linkedin]
      summary: Disconnect LinkedIn account
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                required: [ok]

  /linkedin/sync:
    post:
      operationId: linkedinSync
      tags: [linkedin]
      summary: Sync original posts from LinkedIn into the Library
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedinSyncResponse"

  /analytics/overview:
    get:
      operationId: getAnalyticsOverview
      tags: [drafts]
      summary: Analytics overview response
      responses:
        "200":
          description: Analytics overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsOverviewResponse"

  /analytics/resonance-map:
    get:
      operationId: getResonanceMap
      tags: [drafts]
      summary: Get resonance scores for all published drafts with performance signals
      responses:
        "200":
          description: Map of draftId to resonance score
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: number

  /ai/voice-insights:
    post:
      operationId: generateVoiceInsights
      tags: [ai]
      summary: Generate AI brand voice suggestions from top-resonance posts
      responses:
        "200":
          description: Voice insights result (ok or insufficient)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceInsightsResult"

  /voice-suggestions:
    get:
      operationId: listVoiceSuggestions
      tags: [user]
      summary: List pending voice suggestions for the current user
      responses:
        "200":
          description: List of pending voice suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VoiceSuggestion"

  /voice-suggestions/{id}/accept:
    patch:
      operationId: acceptVoiceSuggestion
      tags: [user]
      summary: Accept a voice suggestion and apply it to preferences
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Suggestion accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceSuggestion"
        "400":
          description: Invalid field or suggestion
        "404":
          description: Suggestion not found

  /voice-suggestions/{id}/dismiss:
    patch:
      operationId: dismissVoiceSuggestion
      tags: [user]
      summary: Dismiss a voice suggestion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Suggestion dismissed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceSuggestion"
        "404":
          description: Suggestion not found

  /ai/post-diagnosis/{draftId}:
    post:
      operationId: generatePostDiagnosis
      tags: [ai]
      summary: Generate or retrieve cached diagnosis for a published post
      parameters:
        - name: draftId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Post diagnosis
          content:
            application/json:
              schema:
                type: object
                properties:
                  diagnosis:
                    $ref: "#/components/schemas/PostDiagnosis"
                required: [diagnosis]
        "404":
          description: Draft not found

  /drafts:
    get:
      operationId: listDrafts
      tags: [drafts]
      summary: List all drafts for the current user
      responses:
        "200":
          description: List of drafts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Draft"
    post:
      operationId: createDraft
      tags: [drafts]
      summary: Create a new draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDraftBody"
      responses:
        "201":
          description: Created draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"

  /drafts/authenticity-check:
    post:
      operationId: checkDraftAuthenticity
      tags: [drafts]
      summary: Run a non-AI, pre-publish authenticity review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckDraftAuthenticityBody"
      responses:
        "200":
          description: Authenticity review result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckDraftAuthenticityResponse"

  /drafts/{id}:
    get:
      operationId: getDraft
      tags: [drafts]
      summary: Get a single draft
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateDraft
      tags: [drafts]
      summary: Update a draft's content or status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDraftBody"
      responses:
        "200":
          description: Updated draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteDraft
      tags: [drafts]
      summary: Delete a draft
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    RegisterBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        displayName:
          type: string
      required:
        - email
        - password
        - displayName

    LoginBody:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    UserResponse:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        displayName:
          type: string
      required:
        - id
        - email
        - displayName

    PreferencesResponse:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        objective:
          type: string
        persona:
          type: string
        tone:
          type: string
        brandRole:
          type: string
        brandAudience:
          type: string
        brandBelief:
          type: string
        aboutMe:
          type: string
          description: Free-text creator bio used as primary AI context; replaces Objective/Persona labels when non-empty.
        onboarded:
          type: boolean
        brandBgColor:
          type: string
          nullable: true
        brandAccentColor:
          type: string
          nullable: true
        brandTextColor:
          type: string
          nullable: true
        backgroundTheme:
          type: string
          nullable: true
          description: Animated background theme key; "none" means default gray.
        bgSpeed:
          type: string
          nullable: true
          description: Animation speed; slow | normal | fast
        siteTheme:
          type: string
          nullable: true
          description: App colour theme preset; indigo | violet | sky | emerald | rose | amber
        brandClosingMode:
          type: string
          enum: [always, smart, never]
          description: Whether to append the saved brand closing to generated LinkedIn posts
        brandClosingStyle:
          type: string
          enum: [signature, follow, expert, custom]
          description: Preset style for the saved brand closing
        brandClosingText:
          type: string
          maxLength: 240
          description: User-controlled closing appended before hashtags
      required:
        - id
        - userId
        - objective
        - persona
        - tone
        - brandRole
        - brandAudience
        - brandBelief
        - onboarded

    UpdatePreferencesBody:
      type: object
      properties:
        objective:
          type: string
        persona:
          type: string
        tone:
          type: string
        brandRole:
          type: string
        brandAudience:
          type: string
        brandBelief:
          type: string
        aboutMe:
          type: string
          maxLength: 500
          description: Free-text creator bio; replaces Objective/Persona labels in AI context when non-empty.
        onboarded:
          type: boolean
        brandBgColor:
          type: string
          nullable: true
        brandAccentColor:
          type: string
          nullable: true
        brandTextColor:
          type: string
          nullable: true
        backgroundTheme:
          type: string
          nullable: true
          description: Animated background theme key; "none" means default gray.
        bgSpeed:
          type: string
          nullable: true
          description: Animation speed; slow | normal | fast
        bgDensity:
          type: string
          nullable: true
          description: Animation particle density; low | normal | high
        bgPanelOpacity:
          type: string
          nullable: true
          description: Content panel opacity; solid | frosted | semi | glass
        bgCustomImageUrl:
          type: string
          nullable: true
          description: Base64 data URL of user-uploaded custom background image
        bgPalette:
          type: string
          nullable: true
          description: Named colour palette for Ripple/Plasma/Prismatic; ocean | sunset | forest | void | ember | rose | arctic | gold
        siteTheme:
          type: string
          nullable: true
          description: App colour theme preset; indigo | violet | sky | emerald | rose | amber
        contentPillars:
          type: array
          items:
            type: string
            maxLength: 60
          maxItems: 6
        writingSamples:
          type: array
          items:
            type: string
            maxLength: 3000
          maxItems: 5
        proofPoints:
          type: array
          items:
            type: string
            maxLength: 200
          maxItems: 8
        aspirationalSamples:
          type: array
          items:
            type: string
            maxLength: 3000
          maxItems: 3
        brandClosingMode:
          type: string
          enum: [always, smart, never]
        brandClosingStyle:
          type: string
          enum: [signature, follow, expert, custom]
        brandClosingText:
          type: string
          maxLength: 240

    SuggestionItem:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        message:
          type: string
        action:
          type: string
      required:
        - id
        - type
        - message
        - action

    StructureIdeaBody:
      type: object
      properties:
        rawInput:
          type: string
        objective:
          type: string
        persona:
          type: string
        tone:
          type: string
      required:
        - rawInput
        - objective
        - persona
        - tone

    HookItem:
      type: object
      properties:
        text:
          type: string
        type:
          type: string
          enum: [how-i, contrarian, number, question, scene-setter, prediction, analogy, how-to, story, disarming-joke, tension-setter, confession]
        usedBefore:
          type: boolean
          nullable: true
        sourceLine:
          type: string
          nullable: true
      required:
        - text

    StructuredBreakdown:
      type: object
      properties:
        topic:
          type: string
        angle:
          type: string
        coreMessage:
          type: string
        whyItMatters:
          type: string
        archetype:
          type: string
        hooks:
          type: array
          items:
            $ref: "#/components/schemas/HookItem"
        narrativeFlow:
          type: array
          items:
            type: string
        storyMode:
          type: boolean
        teacherMode:
          type: boolean
        postFormat:
          type: string
          enum: [standard, frustrated-expert, lived-lesson, clean-breakdown]
          nullable: true
        audience:
          type: string
          description: New 3-input flow audience (e.g. Clients, Peers, Recruiters & Headhunters, Investors, My audience)
        feeling:
          type: string
          description: New 3-input flow feeling (Direct, Witty, Vulnerable, Story, Contrarian)
        hashtags:
          type: string
          description: 3-tier hashtag block (newline- or space-separated; user-editable as one string)
        alternativeHooks:
          type: array
          items:
            type: string
          description: Alternative opener lines the user can swap into the post
        newsAnchor:
          type: object
          nullable: true
          description: When tieToNews=true, the news headline anchor used in the post
          properties:
            headline:
              type: string
            url:
              type: string
            sourceLine:
              type: string
        brandClosing:
          type: object
          nullable: true
          description: User-controlled closing snapshot applied to this draft
          properties:
            enabled:
              type: boolean
            mode:
              type: string
              enum: [always, smart, never]
            style:
              type: string
              enum: [signature, follow, expert, custom]
            text:
              type: string
              maxLength: 240
      required:
        - topic
        - angle
        - coreMessage
        - whyItMatters
        - hooks
        - narrativeFlow

    StructureIdeaResponse:
      type: object
      properties:
        evergreen:
          $ref: "#/components/schemas/StructuredBreakdown"
        trending:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/StructuredBreakdown"
        hookUsage:
          type: object
          additionalProperties:
            type: integer
      required:
        - evergreen

    CarouselSlide:
      type: object
      properties:
        slide:
          type: integer
        title:
          type: string
        description:
          type: string
      required:
        - slide
        - title

    InfographicData:
      type: object
      properties:
        headline:
          type: string
        bullets:
          type: array
          items:
            type: string
      required:
        - headline
        - bullets

    GenerateContentBody:
      type: object
      properties:
        rawInput:
          type: string
        audience:
          type: string
          description: 3-input flow — target audience chip (Clients, Peers, Recruiters & Headhunters, Investors, My audience)
        feeling:
          type: string
          description: 3-input flow — feeling chip (Direct, Witty, Vulnerable, Story, Contrarian)
        tieToNews:
          type: boolean
          description: When true, perform a fresh web search and weave a relevant headline into the post
        newsUrl:
          type: string
          nullable: true
          description: Optional URL of an article the author is reacting to (LinkedIn-import flow)
        extraInstruction:
          type: string
          description: Additional refinement instruction appended to the generation prompt (used by "Try a different angle" and similar refine actions in Capture)
        format:
          type: string
          description: Structural format (standard, dialogue, letter, qa, story_arc) — orthogonal to feeling, used for series parts
        continuityContext:
          type: string
          description: Prior series parts' excerpts, woven in as continuity context when writing a later part of a series
        objective:
          type: string
          description: Legacy back-compat — derivable from audience; the server prefers `audience` when both are set
        persona:
          type: string
          description: Legacy back-compat — kept so older callers/saved drafts still work
        tone:
          type: string
          description: Legacy back-compat — derivable from feeling; the server prefers `feeling` when both are set
      required:
        - rawInput

    NewsAnchor:
      type: object
      properties:
        headline:
          type: string
        url:
          type: string
          nullable: true
        sourceLine:
          type: string
          nullable: true
      required:
        - headline

    GeneratedContent:
      type: object
      properties:
        post:
          type: string
        alternativeHooks:
          type: array
          items:
            type: string
          description: Two alternative opening lines the user can swap in
        shortPost:
          type: string
          nullable: true
        carousel:
          type: array
          items:
            $ref: "#/components/schemas/CarouselSlide"
        visual:
          type: string
        infographic:
          $ref: "#/components/schemas/InfographicData"
          nullable: true
        hashtags:
          type: string
          nullable: true
        newsAnchor:
          $ref: "#/components/schemas/NewsAnchor"
          nullable: true
        newsFallback:
          type: string
          nullable: true
          description: When tieToNews=true and no fresh matching article was found, a short message the UI surfaces (e.g. "No fresh news matched today — generating evergreen.")
        audience:
          type: string
          nullable: true
        feeling:
          type: string
          nullable: true
      required:
        - post
        - carousel
        - visual

    RefineContentBody:
      type: object
      properties:
        content:
          type: string
        instruction:
          type: string
        tab:
          type: string
          enum: [post, short, carousel, visual, infographic, illustration]
      required:
        - content
        - instruction
        - tab

    RefinedContent:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    ExploreDirectionsBody:
      type: object
      properties:
        rawInput:
          type: string
        audience:
          type: string
          nullable: true
      required:
        - rawInput

    DirectionConcept:
      type: object
      properties:
        feeling:
          type: string
        hook:
          type: string
          description: Opening line under 120 characters
        points:
          type: array
          items:
            type: string
          description: 3 key supporting ideas for this angle
      required:
        - feeling
        - hook
        - points

